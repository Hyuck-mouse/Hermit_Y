[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Hermit_Y"
version = "0.1.0"
description = "AI-powered penetration testing and CTF challenge solving agent"
authors = [
  { name = "Security Research Team", email = "security@example.com" }
]
dependencies = [
  "aiohttp>=3.9.0",
  "async-timeout>=4.0.0",
  "click>=8.0.0",
  "cryptography>=42.0.0",
  "dnspython>=2.6.0",
  "nmap>=0.7.0",
  "openai>=1.30.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "requests>=2.32.0",
  "rich>=13.0.0",
  "typer>=0.12.0",
  "urllib3>=2.0.0"
]
requires-python = ">=3.11"

[project.scripts]
hermit-y = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
